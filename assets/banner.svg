<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }

    /* Subtle dynamic pulse & mesh animation */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.7; }
    }
    @keyframes pulseOrbAlt {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.2) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes nodeFloat1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes nodeFloat2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    .dynamic-orb-1 {
      transform-origin: 250px 150px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .dynamic-orb-2 {
      transform-origin: 950px 260px;
      animation: pulseOrbAlt 9s ease-in-out infinite;
    }
    .data-wire {
      stroke-dasharray: 6 6;
      animation: dashCycle 2.5s linear infinite;
    }
    .float-node-1 {
      animation: nodeFloat1 4.5s ease-in-out infinite;
    }
    .float-node-2 {
      animation: nodeFloat2 5s ease-in-out infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <g class="dynamic-orb-1" filter="url(#orbGlow)">
    <circle cx="200" cy="120" r="140" fill="#38bdf8" />
  </g>
  <g class="dynamic-orb-2" filter="url(#orbGlow)">
    <circle cx="980" cy="270" r="160" fill="#818cf8" />
  </g>
  <g filter="url(#orbGlow)" opacity="0.3">
    <circle cx="600" cy="210" r="130" fill="#c084fc" />
  </g>

  <!-- Decorative Decentralized Network Nodes & Mesh (Background Layer) -->
  <g opacity="0.35">
    <!-- Connecting animated data wires -->
    <line x1="820" y1="90" x2="1020" y2="130" stroke="#38bdf8" stroke-width="2" class="data-wire" />
    <line x1="1020" y1="130" x2="1110" y2="250" stroke="#818cf8" stroke-width="2" class="data-wire" />
    <line x1="1020" y1="130" x2="940" y2="330" stroke="#c084fc" stroke-width="2" class="data-wire" />
    <line x1="820" y1="90" x2="940" y2="330" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="85" y1="140" x2="160" y2="280" stroke="#818cf8" stroke-width="1.5" class="data-wire" />
    <line x1="160" y1="280" x2="80" y2="350" stroke="#38bdf8" stroke-width="1.5" class="data-wire" />

    <!-- Peer Nodes -->
    <g class="float-node-1">
      <circle cx="820" cy="90" r="18" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
      <circle cx="820" cy="90" r="6" fill="#38bdf8" />
      <circle cx="1110" cy="250" r="14" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="2" />
      <circle cx="1110" cy="250" r="5" fill="#c084fc" />
      <circle cx="85" cy="140" r="12" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.5" />
    </g>

    <g class="float-node-2">
      <circle cx="1020" cy="130" r="26" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="2.5" filter="url(#glow)" />
      <circle cx="1020" cy="130" r="9" fill="#818cf8" />
      <circle cx="940" cy="330" r="16" fill="url(#nodeGrad)" stroke="#34d399" stroke-width="2" />
      <circle cx="940" cy="330" r="5" fill="#34d399" />
      <circle cx="160" cy="280" r="16" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2" />
    </g>
  </g>

  <!-- Foreground Content: Unobstructed & Crisp -->
  <g id="foreground-content">
    <!-- Tagline / Eyebrow -->
    <g transform="translate(100, 78)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="28" y="19" class="tagline-text">DECENTRALIZED STORAGE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="100" y="152" class="title-text">
      Awesome <tspan fill="url(#primaryGrad)">Cloud Storage</tspan> &amp;
    </text>
    <text x="100" y="206" class="title-text">
      <tspan fill="url(#emeraldGrad)">Decentralized</tspan> Drive Sync
    </text>

    <!-- Subtitle -->
    <text x="100" y="254" class="subtitle-text">
      The definitive curated guide to P2P file sync, zero-knowledge cloud drives, &amp; self-hosted storage.
    </text>

    <!-- Feature Badges / Pills -->
    <g transform="translate(100, 296)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="19" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
        <text x="22" y="24" class="pill-text">⚡ Peer-to-Peer Sync</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="215" height="38" rx="19" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.5" />
        <text x="22" y="24" class="pill-text">🔒 Zero-Knowledge Vaults</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(425, 0)">
        <rect width="195" height="38" rx="19" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.5" />
        <text x="22" y="24" class="pill-text">🏠 Self-Hosted Storage</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(635, 0)">
        <rect width="195" height="38" rx="19" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.5" />
        <text x="22" y="24" class="pill-text">🌐 Distributed VDFS</text>
      </g>
    </g>

    <!-- Bottom Metrics / Highlights Bar -->
    <g transform="translate(100, 368)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" fill="#64748b" font-weight="500">
        📦 20+ Leading Open-Source Engines  •  🏢 Ranked SaaS &amp; Hyperscalers  •  🔐 Client-Side Cryptography  •  🚀 Community Curated
      </text>
    </g>
  </g>
</svg>
